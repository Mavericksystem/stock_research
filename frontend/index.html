<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#1f1d1a" />
  <!--
    Also enforced via response headers in production (frontend/vercel.json).
    Kept here too so it still applies in local dev (vite dev server doesn't
    read vercel.json). connect-src includes localhost:8000 for local API
    calls — replace the onrender.com placeholder with the real backend URL
    once it's mirrored into vercel.json.
  -->
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' http://localhost:8000 https://stock-research-snfv.onrender.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" />
  <meta name="referrer" content="strict-origin-when-cross-origin" />
  <meta name="description"
    content="Market Mind explains why a stock moved. Ask a question and get a sourced, evidence-backed explanation drawn from price action, technical signals, and news." />
  <link rel="canonical" href="https://stockmarketmind.vercel.app/" />
  <title>Market Mind</title>
  <link rel="icon" type="image/png" href="/logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
    rel="stylesheet" />
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
